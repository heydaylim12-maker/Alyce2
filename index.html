<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 문장완성 코치</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#1d2433; --muted:#667085; --accent:#1f4e79; --mint:#2bb3a3; --line:#e4e7ec; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  label { font-weight: 600; display:block; margin-bottom: 8px; }
  select, textarea { width:100%; font-size:1rem; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-family:inherit; }
  textarea { min-height: 90px; resize: vertical; }
  .prompt { font-size: 1.25rem; font-weight: 600; margin: 4px 0 14px; line-height: 1.5; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  button { border:0; border-radius:10px; padding:10px 16px; font-size:1rem; cursor:pointer; font-family:inherit; }
  .primary { background: var(--accent); color:#fff; }
  .ghost { background: #eef2f7; color: var(--accent); }
  button:disabled { opacity:.5; cursor: wait; }
  .score { font-size: 1.4rem; color: var(--mint); font-weight: 700; }
  .fb h3 { margin: 14px 0 4px; font-size: 1rem; color: var(--accent); }
  .fb p { margin: 0; line-height: 1.6; }
  .better { background:#f0faf8; border-left:4px solid var(--mint); padding:10px 12px; border-radius:6px; }
  .err { color:#b42318; }
  footer { color: var(--muted); font-size: .85rem; text-align:center; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>영어 문장완성 코치</h1>
  <p class="sub">미완성 문장을 자유롭게 완성하면 AI 코치가 문법·자연스러움을 피드백합니다.</p>

  <div class="card">
    <label for="level">난이도</label>
    <select id="level">
      <option value="beginner">기초</option>
      <option value="intermediate" selected>중급</option>
      <option value="advanced">심화</option>
    </select>
  </div>

  <div class="card">
    <label>문제</label>
    <div class="prompt" id="prompt"></div>
    <label for="answer">완성한 문장</label>
    <textarea id="answer" placeholder="문장 전체를 영어로 써 보세요."></textarea>
    <div class="row">
      <button class="primary" id="check">피드백 받기</button>
      <button class="ghost" id="next">다른 문제</button>
    </div>
  </div>

  <div class="card fb" id="result" hidden></div>

  <footer>호수돈여자고등학교 · 영어 문장완성 연습</footer>
</main>

<script>
const PROMPTS = {
  beginner: [
    "I like to ___ on weekends.",
    "My favorite food is ___ because ___.",
    "When I feel tired, I ___.",
    "Yesterday, I went to ___ and ___.",
    "I want to be a ___ in the future."
  ],
  intermediate: [
    "If I had more free time, I would ___.",
    "One thing I learned this year is that ___.",
    "Although it was raining, ___.",
    "The reason why I study English is ___.",
    "Technology has changed the way we ___."
  ],
  advanced: [
    "Had I known about the problem earlier, ___.",
    "Not only does climate change affect ___, but it also ___.",
    "What matters most in a good friendship is ___.",
    "The more we rely on AI, the ___.",
    "It is often argued that ___; however, ___."
  ]
};

const $ = (id) => document.getElementById(id);
let current = "";

function pick() {
  const list = PROMPTS[$("level").value];
  let p;
  do { p = list[Math.floor(Math.random() * list.length)]; } while (p === current && list.length > 1);
  current = p;
  $("prompt").textContent = p;
  $("answer").value = "";
  $("result").hidden = true;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

async function check() {
  const answer = $("answer").value.trim();
  if (!answer) { $("answer").focus(); return; }
  const btn = $("check");
  btn.disabled = true; btn.textContent = "분석 중...";
  const box = $("result");
  try {
    const r = await fetch("/api/coach", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: current, answer, level: $("level").value })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "오류가 발생했습니다.");
    box.innerHTML = `
      ${d.score ? `<div class="score">점수 ${esc(d.score)} / 5</div>` : ""}
      ${d.grammar ? `<h3>문법</h3><p>${esc(d.grammar)}</p>` : ""}
      ${d.naturalness ? `<h3>자연스러움</h3><p>${esc(d.naturalness)}</p>` : ""}
      ${d.better ? `<h3>더 자연스러운 표현</h3><p class="better">${esc(d.better)}</p>` : ""}
      ${d.tip ? `<h3>학습 팁</h3><p>${esc(d.tip)}</p>` : ""}`;
  } catch (e) {
    box.innerHTML = `<p class="err">${esc(e.message)}</p>`;
  } finally {
    box.hidden = false;
    btn.disabled = false; btn.textContent = "피드백 받기";
  }
}

$("level").addEventListener("change", pick);
$("next").addEventListener("click", pick);
$("check").addEventListener("click", check);
pick();
</script>
</body>
</html>
